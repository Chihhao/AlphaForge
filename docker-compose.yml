version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alphaforge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=alphaforge
      - POSTGRES_USER=alphaforge
      - POSTGRES_PASSWORD=alphaforge_secret
      - TZ=Asia/Taipei
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - homelab-gateway

  backend:
    image: alphaforge_backend  # Use existing image to avoid re-build
    container_name: alphaforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Taipei
      - DATABASE_URL=postgresql://alphaforge:alphaforge_secret@alphaforge-postgres:5432/alphaforge
    depends_on:
      - postgres
    networks:
      - homelab-gateway

  frontend:
    image: alphaforge_frontend  # Use existing image to avoid re-build
    container_name: alphaforge-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - TZ=Asia/Taipei
      - NEXT_PUBLIC_API_URL=/alphaforge/api
      - INTERNAL_API_URL=http://alphaforge-backend:8000
    depends_on:
      - backend
    networks:
      - homelab-gateway

volumes:
  postgres_data:

networks:
  homelab-gateway:
    external: true
